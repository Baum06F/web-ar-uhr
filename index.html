<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Live-Uhr</title>
  <!-- A-Frame und MindAR Bibliotheken einbinden -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- AR Scene -->
  <a-scene mindar-image="imageTargetSrc: target.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Hier laden wir deine Zeiger-Grafiken (PNGs) -->
      <img id="hour-img" src="hour.png">
      <img id="minute-img" src="minute.png">
      <img id="second-img" src="second.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Verknüpfung mit deinem Target-Bild (Index 0) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Optional: Das Ziffernblatt als Hintergrund-Bild (z.B. ziffernblatt.png) -->
      <!-- <a-plane src="ziffernblatt.png" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane> -->

      <!-- Stundenzeiger -->
      <a-plane id="hour-hand" src="#hour-img" position="0 0 0.01" height="0.4" width="0.05" rotation="0 0 0" transparent="true"></a-plane>
      
      <!-- Minutenzeiger -->
      <a-plane id="minute-hand" src="#minute-img" position="0 0 0.02" height="0.5" width="0.04" rotation="0 0 0" transparent="true"></a-plane>
      
      <!-- Sekundenzeiger -->
      <a-plane id="second-img" position="0 0 0.03" height="0.55" width="0.02" rotation="0 0 0" transparent="true"></a-plane>

    </a-entity>
  </a-scene>

  <!-- JavaScript für die echte Live-Uhrzeit -->
  <script>
    setInterval(() => {
      const now = new Date();
      const s = now.getSeconds();
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      // Berechnung der Winkel (360 Grad / Einheiten)
      // Minus-Zeichen (-), damit sich die Zeiger im Uhrzeigersinn drehen
      const sDeg = -s * 6;     
      const mDeg = -m * 6;     
      const hDeg = -h * 30;  

      // Elemente im DOM ansprechen und Rotation anwenden
      const secHand = document.querySelector('#second-img');
      const minHand = document.querySelector('#minute-hand');
      const hourHand = document.querySelector('#hour-hand');

      if (secHand) secHand.setAttribute('rotation', `0 0 ${sDeg}`);
      if (minHand) minHand.setAttribute('rotation', `0 0 ${mDeg}`);
      if (hourHand) hourHand.setAttribute('rotation', `0 0 ${hDeg}`);
    }, 1000);
  </script>

</body>
</html>
